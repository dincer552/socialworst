name: SSH Client Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ssh-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Android ARM64 APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 0.2.${{ github.run_number }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare persistent update signing key
        id: signing
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed release publishing skipped: configure ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/ssh-client-signing.jks"
          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias hattrickssh >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go for Android cloudflared
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;26.1.10909125"

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y git patch make

      - name: Build cloudflared for Android ARM64
        run: |
          chmod +x scripts/build-cloudflared-android.sh
          scripts/build-cloudflared-android.sh

      - name: Build PTY socket bridge for Android ARM64
        run: |
          mkdir -p src/main/jniLibs/arm64-v8a
          NDK="$ANDROID_HOME/ndk/26.1.10909125"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          "$CC" -O2 -Wall -Wextra -fPIE -pie -Wl,-z,max-page-size=16384 src/main/cpp/sshbridge.c -o src/main/jniLibs/arm64-v8a/libsshbridge.so
          chmod 755 src/main/jniLibs/arm64-v8a/libsshbridge.so
          file src/main/jniLibs/arm64-v8a/libsshbridge.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-provider: basic

      - name: Run unit tests and build debug APK
        run: |
          gradle --no-daemon -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME" testDebugUnitTest assembleDebug

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true' && github.ref == 'refs/heads/main'
        run: |
          gradle --no-daemon -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME" assembleRelease

      - name: Verify packaged Android ARM64 executables
        run: |
          APK="$(find build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p "$RUNNER_TEMP/native-check"
          for LIB in libcloudflared.so libsshbridge.so; do
            unzip -p "$APK" "lib/arm64-v8a/$LIB" > "$RUNNER_TEMP/native-check/$LIB"
            test -s "$RUNNER_TEMP/native-check/$LIB"
            file "$RUNNER_TEMP/native-check/$LIB"
          done

      - name: Prepare debug APK artifact
        run: |
          APK="$(find build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" build/outputs/apk/debug/ssh-client-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ssh-client-debug-apk
          path: build/outputs/apk/debug/ssh-client-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare signed GitHub APK
        if: steps.signing.outputs.configured == 'true' && github.ref == 'refs/heads/main'
        run: |
          APK="$(find build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" build/outputs/apk/release/ssh-client.apk
          cp "$APK" build/outputs/apk/release/hattrick-ssh.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose build/outputs/apk/release/ssh-client.apk

      - name: Verify APK update certificate continuity
        if: steps.signing.outputs.configured == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          OLD_APK_URL="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H 'User-Agent: SSH-Client-CI' https://api.github.com/repos/dincer552/socialworst/releases/latest | jq -r '.assets[] | select(.name == "hattrick-ssh.apk") | .browser_download_url' | head -n 1)"
          test -n "$OLD_APK_URL"
          curl -fsSL "$OLD_APK_URL" -o "$RUNNER_TEMP/previous-ssh-client.apk"
          OLD_CERT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/previous-ssh-client.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          NEW_CERT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs build/outputs/apk/release/ssh-client.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test -n "$OLD_CERT" && test "$OLD_CERT" = "$NEW_CERT"

      - name: Publish signed GitHub Release APK
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: SSH Client v${{ env.APP_VERSION_NAME }}
          target_commitish: main
          make_latest: true
          generate_release_notes: true
          files: |
            build/outputs/apk/release/ssh-client.apk
            build/outputs/apk/release/hattrick-ssh.apk
          fail_on_unmatched_files: true

      - name: Upload signed APK artifact
        if: steps.signing.outputs.configured == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: ssh-client-signed-apk-${{ env.APP_VERSION_NAME }}
          path: build/outputs/apk/release/ssh-client.apk
          if-no-files-found: error
          retention-days: 90
