name: My App Store Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: my-app-store-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify My App Store APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 0.3.${{ github.run_number }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare persistent signing key
        id: signing
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::The existing signing key is required to update installed My App Store builds."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/my-app-store-signing.jks"
          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias hattrickssh >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests and build debug APK
        run: |
          gradle --no-daemon -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME" testDebugUnitTest assembleDebug

      - name: Build signed release APK
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          gradle --no-daemon -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME" assembleRelease

      - name: Verify APK package, version and signing
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          APK="build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.dincer552.hattrickssh' versionCode='$APP_VERSION_CODE'"

      - name: Verify installed-app signing continuity
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          OLD_APK_URL="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H 'User-Agent: My-App-Store-CI' https://api.github.com/repos/dincer552/socialworst/releases/latest | jq -r '.assets[] | select(.name == "ssh-client.apk" or .name == "hattrick-ssh.apk") | .browser_download_url' | head -n 1)"
          if [ -n "$OLD_APK_URL" ] && [ "$OLD_APK_URL" != "null" ]; then
            curl -fsSL "$OLD_APK_URL" -o "$RUNNER_TEMP/previous-store.apk"
            OLD_CERT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/previous-store.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            NEW_CERT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            test -n "$OLD_CERT" && test "$OLD_CERT" = "$NEW_CERT"
          else
            echo "::error::Could not locate the previous published Store APK for certificate continuity verification."
            exit 1
          fi

      - name: Prepare Store APK and legacy updater alias
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          cp build/outputs/apk/release/app-release.apk build/outputs/apk/release/my-app-store.apk
          # The currently installed SSH Client updater expects ssh-client.apk.
          # Keep this alias for the one-time in-place migration to My App Store.
          cp build/outputs/apk/release/app-release.apk build/outputs/apk/release/ssh-client.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-store-debug-apk
          path: build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish signed My App Store Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: My App Store v${{ env.APP_VERSION_NAME }}
          target_commitish: main
          make_latest: true
          generate_release_notes: true
          files: |
            build/outputs/apk/release/my-app-store.apk
            build/outputs/apk/release/ssh-client.apk
          fail_on_unmatched_files: true

      - name: Upload signed APK artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: my-app-store-signed-apk-${{ env.APP_VERSION_NAME }}
          path: build/outputs/apk/release/my-app-store.apk
          if-no-files-found: error
          retention-days: 90
