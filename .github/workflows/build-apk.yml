name: My App Store Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: my-app-store-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify My App Store APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 0.3.${{ github.run_number }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare persistent signing key
        id: signing
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed Store release skipped. Add the existing JKS signing secrets to preserve in-place updates."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/my-app-store-signing.jks"
          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias hattrickssh >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests and build debug APK
        run: |
          gradle --no-daemon -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME" testDebugUnitTest assembleDebug

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          gradle --no-daemon -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME" assembleRelease

      - name: Verify APK package, version and signing
        if: steps.signing.outputs.configured == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          APK="$(find build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          echo "RELEASE_APK=$APK" >> "$GITHUB_ENV"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.dincer552.hattrickssh' versionCode='$APP_VERSION_CODE'"

      - name: Verify installed-app signing continuity
        if: steps.signing.outputs.configured == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Download the last published SSH Client APK through GitHub's authenticated
          # release API. Direct browser_download_url requests can return HTTP 403.
          OLD_RELEASE_TAG="$(gh release view --repo dincer552/socialworst --json tagName --jq .tagName)"
          test -n "$OLD_RELEASE_TAG"
          gh release download "$OLD_RELEASE_TAG" --repo dincer552/socialworst --pattern "ssh-client.apk" --dir "$RUNNER_TEMP"
          OLD_APK="$RUNNER_TEMP/ssh-client.apk"
          test -s "$OLD_APK"

          test -n "$RELEASE_APK" && test -s "$RELEASE_APK"
          OLD_CERT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$OLD_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          NEW_CERT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$RELEASE_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"

          test -n "$OLD_CERT" && test -n "$NEW_CERT"
          echo "Previous app signing certificate: $OLD_CERT"
          echo "New Store signing certificate:      $NEW_CERT"
          if [ "$OLD_CERT" != "$NEW_CERT" ]; then
            echo "::error::Signing certificate mismatch. Refusing to publish an in-place update."
            exit 1
          fi
      - name: Prepare Store APK and legacy updater alias
        if: steps.signing.outputs.configured == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          cp "$RELEASE_APK" build/outputs/apk/release/my-app-store.apk
          # The currently installed SSH Client updater expects ssh-client.apk.
          # Keep this alias for the one-time in-place migration to My App Store.
          cp "$RELEASE_APK" build/outputs/apk/release/ssh-client.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-store-debug-apk
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish signed My App Store Release
        if: steps.signing.outputs.configured == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: My App Store v${{ env.APP_VERSION_NAME }}
          target_commitish: main
          make_latest: true
          generate_release_notes: true
          files: |
            build/outputs/apk/release/my-app-store.apk
            build/outputs/apk/release/ssh-client.apk
          fail_on_unmatched_files: true

      - name: Upload signed APK artifact
        if: steps.signing.outputs.configured == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: my-app-store-signed-apk-${{ env.APP_VERSION_NAME }}
          path: build/outputs/apk/release/my-app-store.apk
          if-no-files-found: error
          retention-days: 90
