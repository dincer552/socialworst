name: My App Store Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: my-app-store-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, centrally sign and publish My App Store
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 0.3.${{ github.run_number }}
      APK_SIGNING_SERVICE_URL: ${{ vars.APK_SIGNING_SERVICE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests and build debug APK
        run: |
          gradle --no-daemon -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME" testDebugUnitTest assembleDebug

      - name: Build unsigned release APK
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          gradle --no-daemon -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME" assembleRelease
          APK="$(find build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          echo "UNSIGNED_APK=$APK" >> "$GITHUB_ENV"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-store-debug-apk
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release for diagnostics
        if: env.UNSIGNED_APK != ''
        uses: actions/upload-artifact@v4
        with:
          name: my-app-store-unsigned-${{ github.run_number }}
          path: ${{ env.UNSIGNED_APK }}
          if-no-files-found: error
          retention-days: 7

      - name: Explain missing central signing endpoint
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.APK_SIGNING_SERVICE_URL == ''
        run: |
          echo "::warning::APK_SIGNING_SERVICE_URL is not configured. No production-signed APK or GitHub Release will be published."

      - name: Obtain short-lived GitHub OIDC token
        id: oidc
        if: env.UNSIGNED_APK != '' && env.APK_SIGNING_SERVICE_URL != ''
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=socialworst-apk-signer")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Sign APK with central My App Store signer
        if: steps.oidc.outcome == 'success'
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "$APK_SIGNING_SERVICE_URL/v1/sign" \
            -H "Authorization: Bearer ${{ steps.oidc.outputs.token }}}" \
            -F "key_id=my-app-store" \
            -F "apk=@$UNSIGNED_APK;type=application/vnd.android.package-archive" \
            -o "$RUNNER_TEMP/my-app-store-signed.apk"
          test -s "$RUNNER_TEMP/my-app-store-signed.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$RUNNER_TEMP/my-app-store-signed.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$RUNNER_TEMP/my-app-store-signed.apk" | grep -F "package: name='com.dincer552.hattrickssh' versionCode='$APP_VERSION_CODE'"
          echo "RELEASE_APK=$RUNNER_TEMP/my-app-store-signed.apk" >> "$GITHUB_ENV"

      - name: Verify installed-app signing continuity
        if: env.RELEASE_APK != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OLD_RELEASE_TAG="$(gh release list --repo dincer552/socialworst --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [ -n "$OLD_RELEASE_TAG" ]; then
            gh release download "$OLD_RELEASE_TAG" --repo dincer552/socialworst --pattern "ssh-client.apk" --dir "$RUNNER_TEMP"
            OLD_APK="$RUNNER_TEMP/ssh-client.apk"
            test -s "$OLD_APK"
            OLD_CERT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$OLD_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            NEW_CERT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$RELEASE_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            test -n "$OLD_CERT" && test -n "$NEW_CERT"
            if [ "$OLD_CERT" != "$NEW_CERT" ]; then
              echo "::error::Signing certificate mismatch. Refusing to publish an in-place update."
              exit 1
            fi
          else
            echo "No previous release exists; first signed release will establish the signing identity."
          fi

      - name: Prepare Store APK and legacy updater alias
        if: env.RELEASE_APK != ''
        run: |
          cp "$RELEASE_APK" build/outputs/apk/release/my-app-store.apk
          cp "$RELEASE_APK" build/outputs/apk/release/ssh-client.apk

      - name: Publish signed My App Store Release
        if: env.RELEASE_APK != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: My App Store v${{ env.APP_VERSION_NAME }}
          target_commitish: main
          make_latest: true
          generate_release_notes: true
          files: |
            build/outputs/apk/release/my-app-store.apk
            build/outputs/apk/release/ssh-client.apk
          fail_on_unmatched_files: true

      - name: Upload signed APK artifact
        if: env.RELEASE_APK != ''
        uses: actions/upload-artifact@v4
        with:
          name: my-app-store-signed-apk-${{ env.APP_VERSION_NAME }}
          path: build/outputs/apk/release/my-app-store.apk
          if-no-files-found: error
          retention-days: 90
