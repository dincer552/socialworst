name: Hattrick SSH Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hattrick-ssh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 0.2.${{ github.run_number }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare persistent update signing key
        id: signing
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APK Release publish skipped: add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/hattrick-ssh-signing.jks"
          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias hattrickssh >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go for Android cloudflared
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125"

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y git patch make

      - name: Build cloudflared for Android ARM64
        run: |
          chmod +x scripts/build-cloudflared-android.sh
          scripts/build-cloudflared-android.sh

      - name: Build PTY socket bridge for Android ARM64
        run: |
          mkdir -p src/main/jniLibs/arm64-v8a
          NDK="$ANDROID_HOME/ndk/26.1.10909125"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          "$CC" -O2 -Wall -Wextra -fPIE -pie -Wl,-z,max-page-size=16384 src/main/cpp/sshbridge.c -o src/main/jniLibs/arm64-v8a/libsshbridge.so
          chmod 755 src/main/jniLibs/arm64-v8a/libsshbridge.so
          file src/main/jniLibs/arm64-v8a/libsshbridge.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-provider: basic

      - name: Build debug APK
        run: |
          gradle --no-daemon -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME" assembleDebug --stacktrace

      - name: Verify packaged Android ARM64 executables
        run: |
          APK="$(find build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p "$RUNNER_TEMP/native-check"
          for LIB in libcloudflared.so libsshbridge.so; do
            unzip -p "$APK" "lib/arm64-v8a/$LIB" > "$RUNNER_TEMP/native-check/$LIB"
            test -s "$RUNNER_TEMP/native-check/$LIB"
            file "$RUNNER_TEMP/native-check/$LIB"
          done

      - name: Prepare stable Release APK filename
        run: |
          APK="$(find build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" build/outputs/apk/debug/hattrick-ssh.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: hattrick-ssh-debug-apk
          path: build/outputs/apk/debug/hattrick-ssh.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: Hattrick SSH v${{ env.APP_VERSION_NAME }}
          target_commitish: main
          make_latest: true
          generate_release_notes: true
          files: build/outputs/apk/debug/hattrick-ssh.apk
          fail_on_unmatched_files: true
